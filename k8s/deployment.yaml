apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-demo-server
  namespace: mcp-servers
  labels:
    app: mcp-demo-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-demo-server
  template:
    metadata:
      labels:
        app: mcp-demo-server
    spec:
      containers:
        - name: mcp-server
          image: demo-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: mcp
          env:
            - name: OPENWEATHER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-api-secret
                  key: API_KEY
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
